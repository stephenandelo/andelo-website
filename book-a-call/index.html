<!DOCTYPE html>
<html lang="en-AU" style="color-scheme:dark;background-color:#0A0C22">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- andelo-critical-canvas -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0C22">
<style>html{color-scheme:dark;background-color:#0A0C22!important}html,body{background-color:#0A0C22!important;color-scheme:dark}.btn-mint{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;background:#3DE68C;color:#04160C;font-weight:700;text-decoration:none;box-shadow:0 8px 22px rgba(61,230,140,.28)}@view-transition{navigation:auto}::view-transition{background-color:#0A0C22}::view-transition-group(root){animation-duration:.01s}::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;height:100%;overflow:clip}</style>
<title>Book a call | Andelo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Compiled Andelo theme (Tailwind v4 CLI → /style.css) -->
<link rel="stylesheet" href="/style.css">
</head>

<body class="bg-canvas text-base text-body font-body antialiased overflow-x-hidden">
<div id="top" class="relative">

  <!-- Ambient glows -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[140px] -left-[100px] w-[540px] h-[540px] rounded-full blur-[24px] bg-[radial-gradient(circle,rgba(61,230,140,.16),transparent_70%)] animate-[pulseGlow_9s_ease-in-out_infinite]"></div>
    <div class="absolute top-[480px] -right-[160px] w-[600px] h-[600px] rounded-full blur-[24px] bg-[radial-gradient(circle,rgba(124,92,240,.15),transparent_70%)] animate-[pulseGlow_12s_ease-in-out_infinite]"></div>
  </div>

<div class="relative z-[1]">

    <!-- Site nav mounted by /assets/site-nav.js -->
  <div data-site-nav-mount></div>
<main id="main">
  <script src="/assets/site-nav.js"></script>


  <!-- ══ HERO ══ -->
  <section class="relative pt-[150px] pb-[30px]">
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(1100px_520px_at_50%_-4%,rgba(124,92,240,.22),transparent_58%)]"></div>
    <div class="relative max-w-[760px] mx-auto px-gutter text-center">
      <h1 class="reveal [transition-delay:40ms] font-display font-bold text-[clamp(40px,5.2vw,64px)] leading-[1.05] tracking-display text-heading-hi">Book a <span class="text-brand">call</span></h1>
      <p class="reveal [transition-delay:80ms] max-w-[600px] mx-auto mt-4 text-body text-[clamp(18px,1.6vw,21px)] leading-[1.55]">15 minutes with Stephen Andelo, our founder. We'll look at your workload and whether we'd fit as an extension of your team, and you'll leave knowing what it would cost. Pick a time that suits you.</p>
    </div>
  </section>

  <!-- ══ SCHEDULER ══ -->
  <section class="pt-[20px] pb-7">
    <div class="max-w-[900px] mx-auto px-gutter">
      <!-- Calendly inline widget begin -->
      <div class="calendly-inline-widget"
        data-url="https://calendly.com/stephen-118/book-a-call?background_color=0a0c22&text_color=eef0ff&primary_color=3de68c"
        style="min-width:320px;height:700px;color-scheme:light;"></div>
      <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
      <!-- Calendly inline widget end -->
    </div>
  </section>
</main>

</div>
</div>

<script>
(function () {
  var root = document;
  /* Scroll reveal */
  var reveals = root.querySelectorAll('.reveal');
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('reveal-in'); io.unobserve(e.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }) : null;
  reveals.forEach(function (el) {
    if (el.getBoundingClientRect().top < window.innerHeight * 1.15) el.classList.add('reveal-in');
    else if (io) io.observe(el); else el.classList.add('reveal-in');
  });

  /* Nav — frosts past 24px, hides on scroll down, returns on scroll up */
  var nav = root.querySelector('[data-nav]');
  var lastY = window.scrollY || 0, ticking = false;
  function updateNav() {
    ticking = false; if (!nav) return;
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    var frosted = y > 24;
    nav.style.background = frosted ? 'rgba(9,11,30,0.92)' : 'transparent';
    nav.style.backdropFilter = frosted ? 'blur(16px)' : 'none';
    /* border handled by site-nav.js */
    if (y <= 120 || y < lastY - 3) nav.style.transform = 'translateY(0)';
    else if (y > lastY + 3) nav.style.transform = 'translateY(-100%)';
    lastY = y;
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(updateNav); } }, { passive: true });
  updateNav();
})();
</script>
</body>
</html>
